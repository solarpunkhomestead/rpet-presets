plugins {
    id 'base'
}

def rootElementDirName = "model"
def modelPresetsSrcDirPath = "$projectDir/$rootElementDirName/presets"
def orcaslicerPresetsBuildDirPath = "$buildDir/orcaslicer"
def yamlExtension = ".yaml"
def jsonExtension = ".json"

tasks.register('buildOrcaSlicerPresets') {
    inputs.files(fileTree("$modelPresetsSrcDirPath"))
    .withPathSensitivity(PathSensitivity.ABSOLUTE)
    outputs.dir(layout.buildDirectory.dir("$orcaslicerPresetsBuildDirPath"))
    doLast {
        new File("$modelPresetsSrcDirPath").eachDir { presetCategoryDir ->
            new File("$presetCategoryDir").eachDir { presetDir ->
                exec {
                    commandLine "bash", "-c", "mkdir -p $orcaslicerPresetsBuildDirPath/$presetCategoryDir.name && npm exec -- yds-load $presetDir -f json > $orcaslicerPresetsBuildDirPath/$presetCategoryDir.name/$presetDir.name$jsonExtension"
                }
            }
        }
    }
}

tasks.named('assemble') {
    dependsOn(buildOrcaSlicerPresets)
}